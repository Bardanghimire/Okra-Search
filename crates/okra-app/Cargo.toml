[package]
name = "okra-brown-search"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "A minimal Windows desktop search launcher written in Rust"
build = "build.rs"

[dependencies]
okra-core = { path = "../okra-core" }
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.24", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.6"
tray-icon = "0.19"
# Real program icons via the shell (IShellItemImageFactory). 0.52 is already in the lockfile.
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[build-dependencies]
winres = "0.1"
