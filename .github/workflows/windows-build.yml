name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check that everything compiles (including tests and examples)
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace
      - name: Build release executables
        run: |
          cargo build --release -p okra-brown-search
          cargo build --release -p okra-index-helper --features admin-manifest
      - name: Upload executables and icon
        uses: actions/upload-artifact@v4
        with:
          name: okra-brown-search-windows-x64
          path: |
            target/release/okra-brown-search.exe
            target/release/okra-index-helper.exe
            assets/okra-brown-search.ico
            README.md
